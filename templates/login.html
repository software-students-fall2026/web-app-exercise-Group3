{% extends "base.html" %}

{% block title %}Admin Login | Campus Lost & Found{% endblock %}

{% block content %}

<section class="page-heading form-page-heading">
    <h1>Admin Login</h1>
    <p>Log in to manage lost-and-found posts.</p>
</section>

<form class="post-form login-form" method="POST">
    {% if error %}
    <p class="form-error" role="alert">{{ error }}</p>
    {% endif %}

    <p>
        <label for="username">Username</label>
        <input type="text" id="username" name="username" value="{{ username }}" autocomplete="username" required>
    </p>

    <p>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
    </p>

    <div class="form-actions">
        <a class="btn btn-secondary" href="{{ url_for('home') }}">
            Back
        </a>

        <button class="btn" type="submit">
            Log In
        </button>
    </div>

</form>

{% endblock %}
