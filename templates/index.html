<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Student Assignment Tracker</title>
</head>
<body>
    <h1>Campus Board</h1>

    {% if items %}
        {% for item in items %}
            <div>
                {% for key, value in item.items() %}
                    {% if key != "_id" %}
                        <p>
                            <strong>{{ key }}:</strong>
                            {{ value }}
                        </p>
                    {% endif %}
                {% endfor %}
            </div>
            <hr>
        {% endfor %}
    {% else %}
        <p>No items available yet.</p>
    {% endif %}
</body>
</html>
