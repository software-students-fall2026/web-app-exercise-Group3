{% extends "base.html" %}

{% block title %}Add Post | Campus Lost & Found{% endblock %}

{% block content %}

<section class="page-heading form-page-heading">
    <h1>Add Post</h1>
    <p>Report an item you lost or found on campus.</p>
</section>

{% if error %}
    <p>{{ error }}</p>
{% endif %}

<form method="POST" class="post-form">
    <p>
        <label>Item name<br>
            <input type="text" name="item_name" value="{{ item.item_name }}">
        </label>
    </p>

    <p>
        <label>Description<br>
            <textarea name="description">{{ item.description }}</textarea>
        </label>
    </p>

    <fieldset class="status-fieldset">
        <legend>Lost or found</legend>
    
        <div class="status-options">
            <label class="status-option">
                <input type="radio"
                        name="status"
                        value="lost"
                        {% if item.status == "lost" %}checked{% endif %}
                        required>
                Lost
            </label>
    
            <label class="status-option">
                <input type="radio"
                        name="status"
                        value="found"
                        {% if item.status == "found" %}checked{% endif %}
                        required>
                Found
            </label>
        </div>
    </fieldset>


    <p>
        <label>Location<br>
            <input type="text" name="location" value="{{ item.location }}">
        </label>
    </p>

    <p>
        <label>Date reported<br>
            <input type="date" name="date_reported" value="{{ item.date_reported }}">
        </label>
    </p>

    <p>
        <label>Contact email<br>
            <input type="email" name="contact_email" value="{{ item.contact_email }}">
        </label>
    </p>

    <div class="form-actions">
        <a class="btn btn-secondary" href="{{ url_for('home') }}">
            Cancel
        </a>

        <button class="btn" type="submit">
            Add Post
        </button>
    </div>
</form>

{% endblock %}
